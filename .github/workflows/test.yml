name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # Runner images may put a newer Homebrew Bash first; cover the 3.2 minimum.
      - name: Use the system Bash 3.2
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf /bin/bash "$RUNNER_TEMP/bin/bash"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: bash --version | head -n 1 && git --version
      - run: node --test

  oldest-git:
    name: ubuntu-22.04 · Git 2.34
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 10
    steps:
      - name: Install Git
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git xz-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bash --version | head -n 1 && git --version
      - run: node --test
